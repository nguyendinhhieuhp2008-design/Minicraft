name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen project
        run: unzip -q megatnt-project.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build jar
        run: gradle build --no-daemon
        working-directory: megatnt
      - uses: actions/upload-artifact@v4
        with:
          name: megatnt-jar
          path: megatnt/build/libs/*.jar
